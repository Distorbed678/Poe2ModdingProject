name: CI

# Checks on every push to main and every pull request: the docs' links, the dev tooling (xtask)
# and a scan of the working tree for secrets. The server is checked and released by the Poe2Server
# repository. What contributors should run locally before a PR: CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      # Submodules: the docs link into modules/server/docs and others (anchors are checked).
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: python3 scripts/check-links.py

  xtask:
    name: Dev tooling (xtask)
    runs-on: ubuntu-latest
    steps:
      # xtask has path dependencies in the submodules: modules/server (Poe2Server, with its own
      # nested protocol, client-hook and web-admin) and modules/client-hook. All are public.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The pinned nightly of rust-toolchain.toml (poe_data_tools needs nightly features).
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # Tests that read the game files skip themselves when GameFiles/ is absent. The server's own
      # build and tests run in the Poe2Server repository's CI.
      - run: cargo test --locked
      - name: The README tracker is current
        run: cargo xtask tracker --check
      - name: The launcher's version files are current
        run: cargo xtask versions --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks over the checked-out files (the history is scanned before a repository goes
      # public, docs/plans/public-release-audit.md). Version and checksum are pinned; the
      # checksum file comes from the same release.
      - name: Scan the working tree
        env:
          GITLEAKS: 8.30.1
        run: |
          # Keep the release's file name: the checksum file lists the archives by name.
          tgz="gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/$tgz"
          curl -fsSL -o gl.sums "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_checksums.txt"
          grep " $tgz\$" gl.sums | sha256sum --check
          tar -xzf "$tgz" gitleaks
          ./gitleaks dir . --redact=100 --no-banner

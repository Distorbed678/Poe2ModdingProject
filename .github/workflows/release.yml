name: Release server

# Pushing a tag `server-v<version>` (for example `server-v0.1.0`) builds poe-server for Linux and
# Windows, packages it with the example config and the web admin, and attaches the archives and
# their SHA-256 checksums to a GitHub release. Running the workflow by hand (workflow_dispatch)
# does the same build and keeps the archives as workflow artifacts, without a release.
# How to cut a release and which secrets this needs: docs/guides/releasing-server.md.
on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#server-v}
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag '$GITHUB_REF_NAME' is not server-v<major>.<minor>.<patch>[-suffix]"
              exit 1
            fi
            # The binary reports the workspace version: a release must say the same.
            ws=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p}' Cargo.toml | head -n 1)
            if [ "${v%%-*}" != "$ws" ]; then
              echo "::error::tag version $v does not match [workspace.package] version $ws in Cargo.toml; bump it (and Cargo.lock) first"
              exit 1
            fi
          else
            v="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing version $v"

  web-admin:
    name: Web admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-submodules
        with:
          paths: modules/web-admin
          web-admin-key: ${{ secrets.WEB_ADMIN_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/web-admin/package-lock.json
      - run: npm ci
        working-directory: modules/web-admin
      - run: npm run check
        working-directory: modules/web-admin
      - run: npm test
        working-directory: modules/web-admin
      - run: npm run build
        working-directory: modules/web-admin
      - uses: actions/upload-artifact@v4
        with:
          name: web-admin-dist
          path: modules/web-admin/dist
          if-no-files-found: error
          retention-days: 7

  schema:
    name: Data schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The server reads the community .datc64 schema at run time. It is a rolling download, so
      # the release ships exactly the file the version file pins (data.schema_sha256).
      - name: Download and verify the dat schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          game=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' config/server.example.toml | head -n 1)
          want=$(sed -n 's/^schema_sha256 *= *"\([0-9a-f]*\)".*/\1/p' "versions/$game.toml")
          [ -n "$want" ] || { echo "::error::versions/$game.toml has no data.schema_sha256"; exit 1; }
          mkdir -p schema
          gh release download latest -R poe-tool-dev/dat-schema -p schema-poe2.min.json -D schema --clobber
          got=$(sha256sum schema/schema-poe2.min.json | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::dat-schema changed upstream: sha256 is $got, versions/$game.toml pins $want. Run cargo xtask check-build with the new schema, then update the pin."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dat-schema
          path: schema/schema-poe2.min.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.platform }})
    needs: [version, web-admin, schema]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: poe-server
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: poe-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The workspace has path dependencies in modules/protocol and modules/client-hook, so both
      # must be present even though poe-server does not use the client hook itself.
      - uses: ./.github/actions/fetch-submodules
        with:
          paths: modules/protocol modules/client-hook
          protocol-key: ${{ secrets.PROTOCOL_DEPLOY_KEY }}
          hook-key: ${{ secrets.HOOK_DEPLOY_KEY }}
      # The pinned nightly of rust-toolchain.toml (poe_data_tools needs nightly features), with
      # the targets and components that file lists.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build poe-server
        run: cargo build --release --locked -p poe-server --target ${{ matrix.target }}
      - name: Test the crates a release stands on
        if: matrix.platform == 'linux'
        run: cargo test --locked -p poe-config -p poe-accounts -p poe-web-api
      - uses: actions/download-artifact@v4
        with:
          name: web-admin-dist
          path: web-admin-dist
      - uses: actions/download-artifact@v4
        with:
          name: dat-schema
          path: dat-schema
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          .github/scripts/package-server.sh "${{ matrix.platform }}" "$VERSION" \
            "target/${{ matrix.target }}/release/${{ matrix.exe }}" \
            web-admin-dist dat-schema/schema-poe2.min.json dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          cat -- *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: dist
        run: |
          game=$(grep -ho 'game-[0-9][0-9a-z.]*' -m1 SHA256SUMS | head -n 1 | sed 's/^game-//; s/-.*//')
          notes=$(printf 'Server %s for Path of Exile 2 client %s.\n\nUnpack the archive for your system and follow HOSTING.md (docs/guides/hosting.md): copy config/server.example.toml to config/server.toml, point game_dir at your own game install and start poe-server. Verify a download with `sha256sum -c <archive>.sha256`.\n' "$VERSION" "$game")
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *.tar.gz *.zip *.sha256 SHA256SUMS
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Server $VERSION (game $game)" --notes "$notes" "${pre[@]}" \
              -- *.tar.gz *.zip *.sha256 SHA256SUMS
          fi

[package]
name = "poe-web-api"
description = "HTTP/WebSocket API for the web admin and the launcher: accounts, sessions, instances, logs"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
hex.workspace = true
poe-accounts.workspace = true
poe-cluster.workspace = true
poe-config.workspace = true
poe-store.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

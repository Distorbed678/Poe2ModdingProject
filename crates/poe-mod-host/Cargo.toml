[package]
name = "poe-mod-host"
description = "Server mod host: the mods folder, load plan, native mod loading (libloading, server API 1), data-tier commands, mod advertisement and the client mod check"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libloading = "0.8"
poe-cluster.workspace = true
poe-config.workspace = true
poe-hook-mods.workspace = true
poe-hook-shared.workspace = true
poe-mod-api.workspace = true
toml.workspace = true
tracing.workspace = true
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

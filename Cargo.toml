[workspace]
resolver = "3"
members = ["crates/*", "servers/*", "xtask"]
# modules/ holds the git submodules (Poe2Protocol, Poe2ClientHook, ...), each its own Cargo
# workspace. They are consumed as path dependencies only. The client DLLs target Windows and
# are built separately (cargo xtask build-dll).
exclude = ["modules"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
poe_data_tools = "4.0.1"
salsa20 = "0.10"
sha2 = "0.10"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
hex = "0.4"

poe-config = { path = "crates/poe-config" }
# Poe2Protocol submodule. The servers use poe-net's TCP connection (feature `tokio`).
poe-net = { path = "modules/protocol/poe-net", features = ["tokio"] }
poe-proto = { path = "modules/protocol/poe-proto" }
# Poe2ClientHook submodule: host-side deploy library used by xtask.
poe-hook-deploy = { path = "modules/client-hook/poe-hook-deploy" }
poe-store = { path = "crates/poe-store" }
poe-cluster = { path = "crates/poe-cluster" }
poe-data = { path = "crates/poe-data" }
poe-game = { path = "crates/poe-game" }
poe-world = { path = "crates/poe-world" }
login-server = { path = "servers/login-server" }
instance-server = { path = "servers/instance-server" }

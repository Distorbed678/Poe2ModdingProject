[workspace]
resolver = "3"
members = ["xtask"]
# modules/ holds the git submodules (Poe2Server, Poe2Protocol, Poe2ClientHook, ...), each its own
# Cargo workspace (or an npm project). xtask consumes some of them as path dependencies only;
# the client DLLs target Windows and are built separately (cargo xtask build-dll), the server is
# built in its own workspace (cargo xtask server build).
exclude = ["modules"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }

# Poe2Server submodule (modules/server): the crates xtask shares code with (the config and
# version files, the game data and the terrain generator).
poe-config = { path = "modules/server/crates/poe-config" }
poe-data = { path = "modules/server/crates/poe-data" }
poe-world = { path = "modules/server/crates/poe-world" }
# Poe2Protocol as the server's nested submodule (modules/server/modules/protocol): poe-world
# and xtask must share ONE poe-proto, so xtask takes it from the same checkout as the server.
poe-proto = { path = "modules/server/modules/protocol/poe-proto" }
# Poe2ClientHook submodule: host-side deploy library used by xtask.
poe-hook-deploy = { path = "modules/client-hook/poe-hook-deploy" }
# Byte-signature table of the client DLL (pure Rust): `cargo xtask check-build` scans an exe with it.
poe-hook-sig = { path = "modules/client-hook/poe-hook-sig" }

# `cargo xtask check-build` scans and fingerprints the 78 MB game image: only fast optimised.
[profile.dev.package.iced-x86]
opt-level = 3
[profile.dev.package.poe-hook-sig]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

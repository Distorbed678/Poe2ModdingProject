# Login protocol opcodes for client 0.5.5e (u16, big-endian on the wire).
# [client] = messages the client sends, [server] = messages the server sends.
# Layouts: Documentation/protocol/login.md, Rust types: crates/poe-proto/src/login.rs
# The client's incoming-packet factory is at 0x14214fa60 (opcode -> class).

[client]
KeepAlive = 0x0001
KeyExchange = 0x0002
Authenticate = 0x0005
PlayCharacter = 0x000e
RequestCharacterDetails = 0x0010
CreateCharacter = 0x0012
RequestCharacterList = 0x0018
# Sent instead of 0x18 after a previous session reached the instance hand-off (u32 account
# id). Provisional: handled like RequestCharacterList.
RequestCharacterListAlt = 0x0046

[server]
KeyExchange = 0x0002
AuthenticationResult = 0x0004
CharacterDetails = 0x0011
CharacterList = 0x0015
CharacterCreated = 0x0016
InstanceDetails = 0x0014
LeagueList = 0x001b

# Instance protocol opcodes for client 0.5.5e (u16, big-endian on the wire).
# Client incoming factory: 0x142170380 (switch on opcode - 0x0d); full opcode -> class
# table: Documentation/re/instance_factory_s2c.json. Game-session handler: 0x142121f70.

[client]
Hello = 0x000f
# Not decoded yet (fixed sizes in [client_body_sizes]); seen after entering an area.
Unknown0062 = 0x0062
Unknown00bc = 0x00bc
Unknown013d = 0x013d
Unknown0221 = 0x0221
Unknown023d = 0x023d
Unknown02e8 = 0x02e8
Unknown0351 = 0x0351
Unknown0357 = 0x0357
TerrainHashes = 0x009a
# Frame report, about every 100 ms: u8 frames, u32 (HNC bits).
FrameReport = 0x001c
# Exit to character selection (no body).
ExitRequest = 0x0173
# Pause/resume request (escape menu in a solo game): u8, u8 paused.
PauseRequest = 0x01ff
# Join a chat channel (global/trade) after entering an area.
ChatJoinRequest = 0x014c
# WASD input (direction vector; zero = stop).
MoveDirection = 0x0063
# Skill use (click-to-move uses the Move skill) and release of its input.
UseSkill = 0x01a5
SkillReleased = 0x01ad
# Not decoded yet: u8 player, u8 (sent when Space is pressed/released).
Unknown02e6 = 0x02e6
# Not decoded yet: u8 player (sent with a dodge roll's UseSkill; sender 0x14210fd56).
Unknown01ac = 0x01ac

[server]
EnableEncryption = 0x0011
PingReply = 0x001d
ChatJoined = 0x014d
AreaInfo = 0x001e
LocalPlayers = 0x0022
InitialState = 0x0023
PlayerEntity = 0x0024
AddInventory = 0x00df
ExitSession = 0x0174
# Simulation messages (second factory 0x142186aa0): queued per frame, applied by 0x142134240.
SimulationTick = 0x02f4
SimulationFrameValue = 0x02f5
SetPause = 0x01fe
AddObject = 0x02f7
# Entity WASD movement (direction + grid position), handled by the Actor component.
MoveDirectionUpdate = 0x0064
# An entity starts an action (skill id, target), handled by the Actor component.
StartAction = 0x01c8

# Body sizes of client messages the server does not decode yet, so batches can be split.
[client_body_sizes]
Unknown0062 = 2
Unknown00bc = 3
Unknown013d = 1
Unknown0221 = 1
Unknown023d = 2
Unknown02e8 = 2
Unknown02e6 = 2
Unknown01ac = 1
Unknown0351 = 1
Unknown0357 = 1

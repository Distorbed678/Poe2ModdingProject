# Client-side DLLs, built for x86_64-pc-windows-msvc with cargo-xwin (`cargo xtask build-dll`).
# Separate from the server workspace.
#   poe-hook        version.dll: proxy + permanent hooks (network guard, Vulkan, window) + loader
#   poe-hook-core   poe_hook_core.dll: features and the debug overlay; hot-reloadable
#   poe-hook-shared code and the loader <-> core ABI shared by both
[workspace]
resolver = "3"
members = ["poe-hook", "poe-hook-core", "poe-hook-shared"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
poe-hook-shared = { path = "poe-hook-shared" }
log = { version = "0.4", features = ["std", "serde"] }
ilhook = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
debug = 1

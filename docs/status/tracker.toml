# Project status tracker. The single source for the progress tables in README.md.
#
# Edit this file, then run `cargo xtask tracker` to re-render README.md between the
# `<!-- tracker:start -->` and `<!-- tracker:end -->` markers (`cargo xtask tracker --check`
# fails if the README is stale).
#
# Links are relative to the repository root (they are rendered into README.md).
# status = "done" (1.0) | "partial" (0.5) | "missing" (0) | "planned" (0).
#   missing = needed and not started or known broken; planned = scheduled in a plan document.


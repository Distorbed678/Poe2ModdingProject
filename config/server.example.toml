# Example server configuration: every key with its default (or a safe starting value), fully
# commented. Copy to config/server.toml (or point POE_CONFIG at a copy) and edit.
# config/server.toml is the working dev config; a test (poe-config) parses both files.
# Paths are relative to the working directory (the repo root when started with `cargo run`).
# Keys marked "required" have no default and must be present; everything else may be left out.
# Old key names (pre-2026-10) are listed in docs/guides/setup.md "Config migration (2026-10)".

[game]
# All keys in [game] are required.
version = "0.5.5e"
# Provided copy of the client install; game data is read from <game_dir>/Bundles2.
game_dir = "GameFiles"
# Community .datc64 schema (third_party/fetch-tools.sh downloads it).
schema = "third_party/dat-schema/schema-poe2.min.json"
# Opcode tables for this client version.
protocol_dir = "modules/protocol/opcodes/0.5.5e"

[network]
# [network] is required (no default addresses).
# Host the clients are sent to: written into gateway_list.txt by `cargo xtask deploy-client`
# (login server) and sent in InstanceDetails (instance server). Use the machine's LAN/public
# address for remote clients (docs/guides/hosting.md).
public_host = "127.0.0.1"

[network.login]
bind = "0.0.0.0:20481"
# Official servers send 0x0017 0x0014 after InstanceDetails, which makes the client close its
# login connection. Our in-game transfers go through that connection, so keep this off.
close_after_handoff = false
# Port written into the client's gateway entry and trusted list when it differs from the bind
# port (port forwarding, docs/guides/hosting.md). Default: the bind port.
# public_port = 20481

[network.instance]
bind = "0.0.0.0:6112"
# Port the login server tells the client to connect to; also where the DLL sends position
# reports (`cargo xtask deploy-client` writes it into the DLL config).
public_port = 6112

[instance]
# Empty instances close after this many minutes (towns and hideouts stay open); 0 = never.
idle_minutes = 15
# Simulation frame interval in ms (one 0x2f4 tick marker per frame; also sent in
# InitialState as the frame length).
tick_ms = 33
# First entity id of an instance's counter, shared by all its players (official: players start
# at 12000; the area's own objects have lower ids).
first_entity_id = 12000

[movement]
# Server-side movement simulation (crates/poe-game, docs/protocol/movement.md). Skill ids,
# walking speed and roll distance come from game data; these are the official 0.5.5e values.
# BuffDefinitions rows of the three buffs a sprint adds.
sprint_buff_rows = [2758, 2737, 2853]

[dev]
# Development and research tools; none are needed for normal play.
# Terrain seeds known to generate, for picking an area's seed while the server's own generator
# does not cover every area (poe-world, docs/status/terrain.md); some random seeds fail in the client. Extracted from a live Client.txt by scripts/re/clientlog_terrain.py.
known_seeds = ""   # default: empty (off); the dev config uses dumps/0.5.5e/terrain/vectors/terrain-vectors.tsv
# Listen for the client DLL's UDP datagrams on the instance port (position reports, overlay
# commands). Reports are only read by the drift checker; they never move the player.
position_sync = true
# Drift checker: log the server's player position against the client's reported one (cells)
# every drift_interval_ms. Needs position_sync and the DLL.
drift_check = false
drift_interval_ms = 1000
# Movement trace: client position reports, inputs and movement replies as TSV
# (docs/protocol/movement.md#movement-trace). Empty to turn it off.
movement_trace = ""   # default: empty (off); the dev config writes runtime/movement-trace.tsv
# Debug link for the client DLL overlay (state view, command registry, instance list, server
# commands from the overlay). Authenticated per session (HMAC), so remote players work too.
debug_link = true
# Terrain seed sweep (research): `<WorldAreas.Id> <seed> [count]` per line; empty = off
# (env POE_SWEEP overrides). Each session generates the next listed layout and ends
# (scripts/re/sweep_drive.py logs the client in again).
sweep = ""
sweep_results = "dumps/0.5.5e/terrain/vectors/sweep-results.tsv"

[terrain]
# Generate each new instance's terrain on the server too (poe-world) and compare its tile hash
# with the one the client reports. The client always generates the terrain itself; leave this
# off until the generator covers every area (docs/status/terrain.md).
generate = false

[cluster]
# Identity of this cluster (docs/architecture/accounts.md). Login tokens carry it; a token
# issued under another id does not validate here.
id = "local"   # default "local"

[commands]
# Prefix for server commands typed in chat (`/` stays with the client's own commands).
prefix = "!"
# Every admin command is appended here (time, account, command, result). Empty = off.
audit_log = ""   # default: empty (off); the dev config writes runtime/admin-audit.log

[web]
# HTTP API and web admin (docs/architecture/web-api.md). Passwords travel in request bodies:
# keep the bind on loopback, or put a TLS reverse proxy in front.
enabled = true   # default true
bind = "127.0.0.1:8080"   # default
# Directory with the built web admin (served at / with an index.html fallback). Empty = none.
static_dir = ""   # default: none
# Browser origins allowed to call the API, e.g. ["http://localhost:5173"] for the Vite dev server.
cors_origins = []   # default: none
# Recent log events kept for the live log viewer.
log_buffer = 2000   # default

[database]
# required
path = "runtime/server.sqlite"

[accounts]
# name_prefix and max_characters are required; the rest default as noted.
# Admin is the account's role (`account role <name> admin`, docs/guides/server-admin.md).
# Dev only: Steam logins (0x0005) auto-create accounts keyed by the client's machine hash,
# named <name_prefix><id>, with no password.
dev_machine_hash_login = false   # default false; the dev config sets true
name_prefix = "Exile"
# Whether POST /api/v1/register may create accounts (docs/architecture/web-api.md); server commands always can.
open_registration = false
# How long a "Remember Me" login stays valid (days).
remember_days = 30
# Character slots per account (sent to the client and enforced on creation).
max_characters = 24
# Two account flag bytes sent with the authentication result; the client splits them into
# bits (docs/protocol/login.md). Byte 0 bits 2/3/4/7 open the terms-of-use window,
# the cheating warning, the RMT warning and "update required" respectively: keep them clear.
flags = [0x63, 0x03]   # default [0, 0]; these are the values the client needs for a normal session
# Full game access (in game: no "Get Full Access" button in the escape menu).
full_access = true
# Stash tabs every account has (until stashes are stored): official new accounts get "1".."4".
stash_tabs = ["1", "2", "3", "4"]

[gateway]
# required
# Entry written into GameFiles/gateway_list.txt (replaces the official list while deployed).
region = "Local"
display_name = "Local Server"

[logging]
# tracing EnvFilter syntax; RUST_LOG overrides it.
filter = "info,poe_net=debug"

[[leagues]]
id = "Standard"
hardcore = false
permanent = true
flag = "StandardFlag"

[[leagues]]
id = "Hardcore"
hardcore = true
permanent = true
variant_of = "Standard"
flag = "HardcoreFlag"

# Player inventories sent on instance entry (one per Inventories.dat row; the client's UI
# looks each slot up and fails on a missing one). Sizes are [width, height].
[inventories]
default_size = [1, 1]
# Row 26 is excluded by the client's inventory registry.
skip = ["StashInventoryId"]

[inventories.sizes]
MainInventory1 = [12, 5]
BodyArmour1 = [2, 3]
Weapon1 = [2, 4]
Offhand1 = [2, 4]
Weapon2 = [2, 4]
Offhand2 = [2, 4]
Helm1 = [2, 2]
Gloves1 = [2, 2]
Boots1 = [2, 2]
Belt1 = [2, 1]
Flask1 = [5, 1]

# Player start position. The layout comes from the client DLL, which exports (or, on a trusted
# server, uploads) the area it generated; the server does not yet use its own generated layout.
# The player starts on the area's start tile, or else on the playable tile nearest the map centre.
[spawn]
layout_dir = "dumps/0.5.5e/terrain"
filler = ["fill", "blank"]

# First visit plays the washed-up opening (new characters on the Riverbank).
intro_areas = ["G1_1"]

# Start tile per area, and the start point inside it in the tile's own orientation (grid cells
# from its corner); the spawn is then snapped to the nearest walkable cell.
# The Riverbank: washed up on the shore beside the intro tree.
[spawn.start_tiles.G1_1]
tile = "Intro_Tree"
point = [9, 33]

# Terrain uploads from client DLLs on trusted servers (docs/guides/hosting.md): the first
# client to generate an area sends its layout and cell grid, the server caches them in
# layout_dir per tile hash and the other clients reuse them. A remote client needs no shared
# disk. Local files in layout_dir still work.
[spawn.upload]
enabled = true
# Limits: the upload as sent (compressed), and each part after decompression, in bytes.
max_bytes = 33554432
max_layout_bytes = 16777216
max_grid_bytes = 134217728
# How long a spawn waits for the layout without / with an announced upload.
wait_ms = 3000
wait_upload_secs = 60

# Chat: the channel given to "join any" requests (global/trade); lines are routed by channel.
[chat]
default_channel = 1

# Player characters: skills every character has (GrantedEffects ids, level 1). Basic actions
# such as Move come from the class template and are not listed here.
# New characters start in start_area (WorldAreas id) unless their start state has a hub area.
[player]
innate_skills = ["DodgeRollPlayer"]
start_area = "G1_1"
# Animation set names other players' clients get for a character (main hand, off hand, default;
# official: weapon-dependent, `BowTown` ..., `UnarmedTown`, `default`). Characters have no
# equipment yet, so all are unarmed.
animation_sets = ["UnarmedTown", "UnarmedTown", "default"]

# Server configuration. Paths are relative to the working directory (the repo root
# when started with `cargo run`). Override the file location with POE_CONFIG=<path>.

[game]
version = "0.5.5e"
# Provided copy of the client install; game data is read from <game_dir>/Bundles2.
game_dir = "GameFiles"
# Community .datc64 schema (Tools/fetch-tools.sh downloads it).
schema = "Tools/dat-schema/schema-poe2.min.json"
# Opcode tables for this client version.
protocol_dir = "protocol/0.5.5e"

[login]
bind = "0.0.0.0:20481"
# Host written into gateway_list.txt by `cargo xtask deploy-client`.
public_host = "127.0.0.1"

[instance]
bind = "0.0.0.0:6112"
# Host/port the login server tells the client to connect to.
public_host = "127.0.0.1"
public_port = 6112
# Simulation frame interval in ms (one 0x2f4 tick marker per frame).
tick_ms = 33

[database]
path = "data/server.sqlite"

[accounts]
# Accounts are created automatically on first login, keyed by the client's machine hash,
# and named <name_prefix><id>.
name_prefix = "Exile"
# Character slots per account (sent to the client and enforced on creation).
max_characters = 24
# Two account flag bytes sent with the authentication result; the client splits them into
# bits (Documentation/protocol/login.md). Byte 0 bits 2/3/4/7 open the terms-of-use window,
# the cheating warning, the RMT warning and "update required" respectively: keep them clear.
flags = [0x63, 0x03]

[gateway]
# Entry written into GameFiles/gateway_list.txt (replaces the official list while deployed).
region = "Local"
display_name = "Local Server"

[logging]
# tracing EnvFilter syntax; RUST_LOG overrides it.
filter = "info,poe_net=debug"

[[leagues]]
id = "Standard"
hardcore = false

[[leagues]]
id = "Hardcore"
hardcore = true

# Player inventories sent on instance entry (one per Inventories.dat row; the client's UI
# looks each slot up and fails on a missing one). Sizes are [width, height].
[inventories]
default_size = [1, 1]
# Row 26 is excluded by the client's inventory registry.
skip = ["StashInventoryId"]

[inventories.sizes]
MainInventory1 = [12, 5]
BodyArmour1 = [2, 3]
Weapon1 = [2, 4]
Offhand1 = [2, 4]
Weapon2 = [2, 4]
Offhand2 = [2, 4]
Helm1 = [2, 2]
Gloves1 = [2, 2]
Boots1 = [2, 2]
Belt1 = [2, 1]
Flask1 = [5, 1]

# Player start position. Dev bridge until server-side terrain generation (M4): the client DLL
# exports the generated layout and the player starts on the area's start tile, or else on
# the playable tile nearest the map centre.
[spawn]
layout_dir = "GameFiles"
filler = ["fill", "blank"]

[spawn.start_tiles]
# The washed-up intro of the Riverbank (next to the intro tree; the tree centre itself is not
# walkable in every orientation).
G1_1 = "ZombieIntroFeature"

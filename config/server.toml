# Server configuration. Paths are relative to the working directory (the repo root
# when started with `cargo run`). Override the file location with POE_CONFIG=<path>.

[game]
version = "0.5.5e"
# Provided copy of the client install; game data is read from <game_dir>/Bundles2.
game_dir = "GameFiles"
# Community .datc64 schema (Tools/fetch-tools.sh downloads it).
schema = "Tools/dat-schema/schema-poe2.min.json"
# Opcode tables for this client version.
protocol_dir = "protocol/0.5.5e"

[login]
bind = "0.0.0.0:20481"
# Host written into gateway_list.txt by `cargo xtask deploy-client`.
public_host = "127.0.0.1"

[instance]
bind = "0.0.0.0:6112"
# Host/port the login server tells the client to connect to.
public_host = "127.0.0.1"
public_port = 6112
# Simulation frame interval in ms (one 0x2f4 tick marker per frame; also sent in
# InitialState as the frame length).
tick_ms = 33
# Terrain seeds known to generate (dev bridge until server-side generation, M4); some random
# seeds fail in the client. Extracted from a live Client.txt by tools/re/clientlog_terrain.py.
known_seeds = "data/terrain-vectors.tsv"
# Movement trace (dev): client position reports, inputs and movement replies as TSV
# (Documentation/protocol/movement.md#movement-trace). Empty to turn it off.
movement_trace = "data/movement-trace.tsv"
# Cell sent with a turn: "natural" (the cell the client reaches in that frame; it is put on
# its centre), "own" (re-aim only) or "heading" (a cell one step along the new heading).
# See Documentation/protocol/movement.md#lag-m35.
turn_cell = "natural"
# Hold a turn back by up to one frame when that lands it nearer a cell centre (smaller
# snaps at turns, some turns 33 ms later).
turn_timing = true
# Turn the player toward the cursor, except while walking by click-to-move or rolling (the
# client reports the cursor with its position; mapped to grid cells by cursor_to_grid).
face_cursor = true

[database]
path = "data/server.sqlite"

[accounts]
# Accounts are created automatically on first login, keyed by the client's machine hash,
# and named <name_prefix><id>.
name_prefix = "Exile"
# Character slots per account (sent to the client and enforced on creation).
max_characters = 24
# Two account flag bytes sent with the authentication result; the client splits them into
# bits (Documentation/protocol/login.md). Byte 0 bits 2/3/4/7 open the terms-of-use window,
# the cheating warning, the RMT warning and "update required" respectively: keep them clear.
flags = [0x63, 0x03]
# Full game access (in game: no "Get Full Access" button in the escape menu).
full_access = true

[gateway]
# Entry written into GameFiles/gateway_list.txt (replaces the official list while deployed).
region = "Local"
display_name = "Local Server"

[logging]
# tracing EnvFilter syntax; RUST_LOG overrides it.
filter = "info,poe_net=debug"

[[leagues]]
id = "Standard"
hardcore = false
permanent = true
flag = "StandardFlag"

[[leagues]]
id = "Hardcore"
hardcore = true
permanent = true
variant_of = "Standard"
flag = "HardcoreFlag"

# Player inventories sent on instance entry (one per Inventories.dat row; the client's UI
# looks each slot up and fails on a missing one). Sizes are [width, height].
[inventories]
default_size = [1, 1]
# Row 26 is excluded by the client's inventory registry.
skip = ["StashInventoryId"]

[inventories.sizes]
MainInventory1 = [12, 5]
BodyArmour1 = [2, 3]
Weapon1 = [2, 4]
Offhand1 = [2, 4]
Weapon2 = [2, 4]
Offhand2 = [2, 4]
Helm1 = [2, 2]
Gloves1 = [2, 2]
Boots1 = [2, 2]
Belt1 = [2, 1]
Flask1 = [5, 1]

# Player start position. Dev bridge until server-side terrain generation (M4): the client DLL
# exports the generated layout and the player starts on the area's start tile, or else on
# the playable tile nearest the map centre.
[spawn]
layout_dir = "GameFiles"
filler = ["fill", "blank"]

# First visit plays the washed-up opening (new characters on the Riverbank).
intro_areas = ["G1_1"]

# Start tile per area, and the start point inside it in the tile's own orientation (grid cells
# from its corner); the spawn is then snapped to the nearest walkable cell.
# The Riverbank: washed up on the shore beside the intro tree.
[spawn.start_tiles.G1_1]
tile = "Intro_Tree"
point = [9, 33]

# Chat: no chat server yet; global/trade join requests are answered with this channel.
[chat]
default_channel = 1

# Player characters: skills every character has (GrantedEffects ids, level 1). Basic actions
# such as Move come from the class template and are not listed here.
# New characters start in start_area (WorldAreas id) unless their start state has a hub area.
[player]
innate_skills = ["DodgeRollPlayer"]
start_area = "G1_1"
